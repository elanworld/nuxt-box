# Append inside the existing :443 server block on www.xianneng.top
# All task-library traffic (including /api/bot/) goes through existing Gin admin / oauth2 gateway.
# Remove any legacy location that bypassed auth for /task-library/api/bot/.
location /task-library/ {
    auth_request /oauth2/auth;
    error_page 401 = /oauth2/sign_in?rd=%2Ftask-library%2F;
    proxy_pass http://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}